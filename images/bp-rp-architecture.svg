<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <rect width="800" height="260" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="30" width="320" height="200" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="65" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#38bdf8">RESOURCE PACK (RP)</text>
  <text x="190" y="95" font-family="monospace" font-size="13" text-anchor="middle" fill="#e2e8f0">textures/items/*.png (ibisPaint/Pixly)</text>
  <text x="190" y="125" font-family="monospace" font-size="13" text-anchor="middle" fill="#e2e8f0">models/entity/*.geo.json (Blockbench)</text>
  <text x="190" y="155" font-family="monospace" font-size="13" text-anchor="middle" fill="#e2e8f0">animations/*.animation.json</text>
  <text x="190" y="185" font-family="monospace" font-size="13" text-anchor="middle" fill="#e2e8f0">texts/en_US.lang &amp; sounds/</text>
  <path d="M365 130 L435 130" stroke="#04AA6D" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="400" cy="130" r="18" fill="#04AA6D"/>
  <text x="400" y="136" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
  <rect x="450" y="30" width="320" height="200" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="610" y="65" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fbbf24">BEHAVIOR PACK (BP)</text>
  <text x="610" y="95" font-family="monospace" font-size="13" text-anchor="middle" fill="#e2e8f0">items/*.json &amp; blocks/*.json</text>
  <text x="610" y="125" font-family="monospace" font-size="13" text-anchor="middle" fill="#e2e8f0">entities/*.json &amp; recipes/*.json</text>
  <text x="610" y="155" font-family="monospace" font-size="13" text-anchor="middle" fill="#34d399">scripts/main.js (@minecraft/server)</text>
  <text x="610" y="185" font-family="monospace" font-size="13" text-anchor="middle" fill="#34d399">UI Menus (@minecraft/server-ui)</text>
</svg>